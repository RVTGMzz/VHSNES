name: Chibi SNES source localization checks

on:
  push:
    branches:
      - chibi-maruko-bootstrap-01
    paths:
      - 'games/ChibiMarukoChan-Mezase-Minami-no-Island/**'
      - '.github/workflows/chibi-snes-source-qa.yml'
  pull_request:
    paths:
      - 'games/ChibiMarukoChan-Mezase-Minami-no-Island/**'
      - '.github/workflows/chibi-snes-source-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository sources
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax without importing game binaries
        run: python -m compileall -q games/ChibiMarukoChan-Mezase-Minami-no-Island/tools
      - name: Verify all 381 Quiz sources and 279 unique staged records
        working-directory: games/ChibiMarukoChan-Mezase-Minami-no-Island
        run: python tools/audit_quiz_unique_061.py
      - name: Verify 150 original answer offsets and 81 full-Vietnamese pending choices
        working-directory: games/ChibiMarukoChan-Mezase-Minami-no-Island
        run: python tools/audit_quiz_repo_no_rom_070.py
      - name: Verify reconstruction chain and reject forged 039–043 archives (ROM-free)
        working-directory: games/ChibiMarukoChan-Mezase-Minami-no-Island
        run: python tools/selftest_recovery_071.py
      - name: Verify 81 complete Vietnamese Quiz answers fit disjoint native 66-byte copy windows
        working-directory: games/ChibiMarukoChan-Mezase-Minami-no-Island
        run: python tools/plan_quiz_bankcopy_slots_073.py
      - name: Block 81-answer bulk release when 29 exceed native 32-byte WRAM stride
        working-directory: games/ChibiMarukoChan-Mezase-Minami-no-Island
        run: python tools/audit_quiz_wram_stride_074.py
      - name: Simulate three native 66-byte Quiz WRAM copies and assert 18 overwrites
        working-directory: games/ChibiMarukoChan-Mezase-Minami-no-Island
        run: python tools/selftest_quiz_wram_layout_074.py
      - name: Verify actual Quiz caller COPY then immediate renderer JSL ordering (ROM-free scenario model)
        working-directory: games/ChibiMarukoChan-Mezase-Minami-no-Island
        run: python tools/audit_quiz_copy_render_order_075.py
      - name: Test 061/070/071 SHA report compatibility for one-archive 076 merge
        working-directory: games/ChibiMarukoChan-Mezase-Minami-no-Island
        run: python tools/selftest_merge_076.py
      - name: Audit 21 remaining Quiz nonanswer rows and one native continuation manifest
        working-directory: games/ChibiMarukoChan-Mezase-Minami-no-Island
        run: python tools/audit_quiz_nonanswers_077.py
      - name: Verify 078 two original-pointer-anchored Quiz explanation fields and fixed Vietnamese line capacities
        working-directory: games/ChibiMarukoChan-Mezase-Minami-no-Island
        run: python tools/audit_quiz_native_fields_078.py
      - name: Audit 079 old Quiz omissions and seven exact original glyph cells, preserve stages 057-059
        working-directory: games/ChibiMarukoChan-Mezase-Minami-no-Island
        run: python tools/selftest_quiz_parent_semantics_079.py
      - name: Verify 080 Maruko SNES native Quiz semantic corrections retain 054-058 fingerprints
        working-directory: games/ChibiMarukoChan-Mezase-Minami-no-Island
        run: python -c "import sys;sys.path.insert(0,'tools');from build_quiz_parent_semantic_restore_080 import audit;from pathlib import Path;print(audit(Path('.')))"
      - name: Verify 081 four Quiz context repairs and eleven original Japanese glyph cells (ROM-free)
        working-directory: games/ChibiMarukoChan-Mezase-Minami-no-Island
        run: python -c "import sys;sys.path.insert(0,'tools');from build_quiz_parent_semantic_restore_081 import audit;from pathlib import Path;print(audit(Path('.')))"
      - name: Verify 082 two Quiz narrative fixes and exact V2 glyph fits (ROM-free)
        working-directory: games/ChibiMarukoChan-Mezase-Minami-no-Island
        run: python tools/build_quiz_parent_semantic_restore_082.py --audit-only
      - name: Verify 083 four authentic Fortune source captions and why they cannot fit old cells
        working-directory: games/ChibiMarukoChan-Mezase-Minami-no-Island
        run: python tools/audit_fortune_expansion_083.py
      - name: Verify 083 Sugiyama-and-Ono Quiz narrative name restoration
        working-directory: games/ChibiMarukoChan-Mezase-Minami-no-Island
        run: python tools/build_quiz_sugiyama_ono_083.py --audit-only
      - name: Verify 084 four context-faithful Quiz corrections keep exact stage054-058 byte capacities
        working-directory: games/ChibiMarukoChan-Mezase-Minami-no-Island
        run: python tools/build_quiz_semantic_context_batch_084.py --audit-only
      - name: Verify 085 seven Japanese Quiz omissions repaired in existing V2 frames
        working-directory: games/ChibiMarukoChan-Mezase-Minami-no-Island
        run: python tools/build_quiz_seven_fact_restore_085.py --audit-only
      - name: Verify 086 seven Quiz fact and dialogue repairs in original 057 Japanese frames
        working-directory: games/ChibiMarukoChan-Mezase-Minami-no-Island
        run: python tools/build_quiz_context_semantics_086.py --audit-only
      - name: Execute 087 Quiz layout hooks and verify native fallback (ROM-free)
        working-directory: games/ChibiMarukoChan-Mezase-Minami-no-Island
        run: python tools/selftest_quiz_layout_087.py
      - name: Confirm no ROM or game-font binaries committed to source folder
        run: |
          if find games/ChibiMarukoChan-Mezase-Minami-no-Island \
              -type f \( -iname '*.sfc' -o -iname '*.smc' \
              -o -iname '*.rom' -o -iname '*.ips' \) \
              -print -quit | grep -q .; then
            echo 'Refusing copyrighted ROM or unreviewed IPS binary in source branch'
            exit 1
          fi
          echo 'Source-only CI checks completed'
