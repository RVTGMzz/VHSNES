name: Chibi graphics reverse and build static

on:
  push:
    branches:
      - chibi-maruko-bootstrap-01
    paths:
      - "games/ChibiMarukoChan-Mezase-Minami-no-Island/tools/**"
      - ".github/workflows/chibi-g0-reverse-tools-static.yml"
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/ChibiMarukoChan-Mezase-Minami-no-Island/tools
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile reverse tools
        run: python -m py_compile *.py

      - name: Run G0 reverse selftest
        run: python selftest_g0_reverse_tools.py

      - name: Run G1 reverse selftest
        run: python selftest_g1_reverse_tools.py

      - name: Run G2 G3 reverse selftest
        run: python selftest_g2_g3_reverse_tools.py

      - name: Run G2 targeted start-flow selftest
        run: python selftest_g2_start_flow.py

      - name: Run G2 school-front resource collector selftest
        run: python selftest_g2_school_front_resources.py

      - name: Run G2 conversation direct-text probe selftest
        run: python selftest_g2_conversation_direct_probe.py

      - name: Run G2 direct-text Probe 003 framing selftest
        run: python selftest_g2_conversation_direct_probe_003.py

      - name: Run G2 Probe 004 medium-font selftest
        run: python selftest_g2_probe_004_medium_font.py

      - name: Run G2 Probe 005 dialogue-font selftest
        run: python selftest_g2_probe_005_dialogue_font.py

      - name: Run graphics patch manifest selftest
        run: python selftest_graphics_patch_manifest.py

      - name: Run Vietnamese SNES graphics rasterizer selftest
        run: python selftest_vi_text_snes_graphics.py

      - name: Run graphics fit planner selftest
        run: python selftest_graphics_asset_fit.py

      - name: Run graphics manifest assembler selftest
        run: python selftest_graphics_manifest_assembler.py

      - name: Run indexed PNM graphics encoder selftest
        run: python selftest_indexed_pnm_snes_graphics.py
